<text x="380" y="249" font-size="18" font-weight="normal" text-anchor="start" fill="#172e43">Direct EngineClient access</text>
<rect x="850" y="150" width="310" height="145" rx="12" fill="white" stroke="#007f79" stroke-width="2"/>

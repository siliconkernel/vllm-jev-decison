<text x="60" y="449" font-size="18" font-weight="normal" text-anchor="start" fill="#172e43">Separate bridge process</text>
<rect x="360" y="350" width="400" height="145" rx="12" fill="white" stroke="#b36718" stroke-width="2"/>
<text x="380" y="385" font-size="21" font-weight="bold" text-anchor="start" fill="#b36718">HTTP compatibility bridge</text>

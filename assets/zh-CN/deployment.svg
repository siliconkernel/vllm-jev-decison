<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img">
<title>原生插件与可选 HTTP bridge</title><desc>相同的请求 Schema，不同的接入方式与验证边界。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8" fill="#506478"/></marker></defs>
<rect width="1200" height="610" rx="18" fill="#f7fafc"/>
<g font-family="Arial, Noto Sans CJK SC, Microsoft YaHei, sans-serif">
<text x="42" y="58" font-size="30" font-weight="bold" text-anchor="start" fill="#172e43">原生插件与可选 HTTP bridge</text>
<text x="42" y="94" font-size="18" font-weight="normal" text-anchor="start" fill="#506478">相同的请求 Schema，不同的接入方式与验证边界。</text>
<path d="M300 222 L360 222" stroke="#506478" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<path d="M760 222 L850 222" stroke="#506478" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<path d="M300 422 L360 422" stroke="#506478" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<path d="M760 422 L850 422" stroke="#506478" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<rect x="40" y="150" width="260" height="145" rx="12" fill="white" stroke="#172e43" stroke-width="2"/>
<text x="60" y="185" font-size="21" font-weight="bold" text-anchor="start" fill="#172e43">客户端</text>
<text x="60" y="220" font-size="18" font-weight="normal" text-anchor="start" fill="#172e43">发送 HTTP 请求</text>
<text x="60" y="249" font-size="18" font-weight="normal" text-anchor="start" fill="#172e43">/plugins/jev-decison/infer</text>
<rect x="360" y="150" width="400" height="145" rx="12" fill="white" stroke="#007f79" stroke-width="2"/>
<text x="380" y="185" font-size="21" font-weight="bold" text-anchor="start" fill="#007f79">vLLM API 进程</text>
<text x="380" y="220" font-size="18" font-weight="normal" text-anchor="start" fill="#172e43">EndpointPlugin：jev-decison</text>
<text x="380" y="249" font-size="18" font-weight="normal" text-anchor="start" fill="#172e43">直接调用 EngineClient</text>
<rect x="850" y="150" width="310" height="145" rx="12" fill="white" stroke="#007f79" stroke-width="2"/>
<text x="870" y="185" font-size="21" font-weight="bold" text-anchor="start" fill="#007f79">已有推理引擎</text>
<text x="870" y="220" font-size="18" font-weight="normal" text-anchor="start" fill="#172e43">复用同一份模型</text>
<text x="870" y="249" font-size="18" font-weight="normal" text-anchor="start" fill="#172e43">无需源码补丁</text>
<rect x="40" y="350" width="260" height="145" rx="12" fill="white" stroke="#172e43" stroke-width="2"/>
<text x="60" y="385" font-size="21" font-weight="bold" text-anchor="start" fill="#172e43">客户端</text>
<text x="60" y="420" font-size="18" font-weight="normal" text-anchor="start" fill="#172e43">相同 HTTP API</text>
<text x="60" y="449" font-size="18" font-weight="normal" text-anchor="start" fill="#172e43">独立 bridge 进程</text>
<rect x="360" y="350" width="400" height="145" rx="12" fill="white" stroke="#b36718" stroke-width="2"/>
<text x="380" y="385" font-size="21" font-weight="bold" text-anchor="start" fill="#b36718">HTTP 兼容桥接</text>
<text x="380" y="420" font-size="18" font-weight="normal" text-anchor="start" fill="#172e43">tokenize + completions</text>
<text x="380" y="449" font-size="18" font-weight="normal" text-anchor="start" fill="#172e43">测试无需重启已有服务</text>
<rect x="850" y="350" width="310" height="145" rx="12" fill="white" stroke="#b36718" stroke-width="2"/>
<text x="870" y="385" font-size="21" font-weight="bold" text-anchor="start" fill="#b36718">已有 vLLM API</text>
<text x="870" y="420" font-size="18" font-weight="normal" text-anchor="start" fill="#172e43">已有模型服务</text>
<text x="870" y="449" font-size="18" font-weight="normal" text-anchor="start" fill="#172e43">不涉及原生插件加载</text>
<text x="42" y="551" font-size="17" font-weight="normal" text-anchor="start" fill="#506478">原生目标版本：vLLM 0.29.0。GPU 服务中的插件启动尚未验收。</text>
<text x="42" y="577" font-size="17" font-weight="normal" text-anchor="start" fill="#506478">真实 DeepSeek 冒烟记录仅验证 bridge，不代表原生插件已部署验收。</text>
</g></svg>